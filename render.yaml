services:
  # ---------------------------------------------------------------------------
  # StepSheet Enterprise Cloud Backend (FastAPI + DuckDB)
  # ---------------------------------------------------------------------------
  - type: web
    name: stepsheet-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: standard
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: REQUIRE_AUTH
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false  # Configure with Supabase PostgreSQL connection string
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_ENDPOINT_URL
        sync: false  # e.g. https://<account_id>.r2.cloudflarestorage.com
      - key: S3_ACCESS_KEY
        sync: false  # Cloudflare R2 / AWS S3 Access Key ID
      - key: S3_SECRET_KEY
        sync: false  # Cloudflare R2 / AWS S3 Secret Access Key
      - key: S3_BUCKET_NAME
        value: stepsheet-enterprise-datasets
      - key: S3_REGION
        value: auto
      - key: DUCKDB_MEMORY_LIMIT
        value: 4GB
      - key: DUCKDB_THREADS
        value: "4"
      - key: CORS_ORIGINS
        value: '["https://stepsheet.app","https://www.stepsheet.app","https://gmani0005-sys.github.io"]'
      - key: PORT
        value: "8000"
