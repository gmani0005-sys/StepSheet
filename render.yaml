services:
  # ---------------------------------------------------------------------------
  # StepSheet Enterprise Cloud Backend (FastAPI + DuckDB)
  # ---------------------------------------------------------------------------
  - type: web
    name: stepsheet-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: standard
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: REQUIRE_AUTH
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false  # Configure with Supabase PostgreSQL connection string
      - key: STORAGE_BACKEND
        value: local
      - key: LOCAL_STORAGE_DIR
        value: /app/storage
      - key: DUCKDB_MEMORY_LIMIT
        value: 4GB
      - key: DUCKDB_THREADS
        value: "4"
      - key: CORS_ORIGINS
        value: '["https://stepsheet.app","https://www.stepsheet.app","https://gmani0005-sys.github.io"]'
      - key: PORT
        value: "8000"
    # Optional persistent disk for Render paid instances (uncomment to keep files across redeploys):
    # disk:
    #   name: stepsheet-storage
    #   mountPath: /app/storage
    #   sizeGB: 10
