[package]
name = "stepsheet-desktop"
version = "1.0.0"
description = "StepSheet — No-Code Data Workbench (Desktop)"
authors = ["StepSheet"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
